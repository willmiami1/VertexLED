<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Preview — VertexLED</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #1a1f2b;
      font-family: system-ui, sans-serif;
      padding: 24px 0;
    }
    .label { color: #9aa7bd; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
    .phone {
      width: 390px;
      height: 844px;
      max-height: calc(100vh - 90px);
      border: 12px solid #0b0e14;
      border-radius: 44px;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0,0,0,0.6);
      position: relative;
      background: #000;
    }
    .notch {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 24px;
      background: #0b0e14;
      border-radius: 12px;
      z-index: 10;
    }
    iframe { width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <div class="label">Mobile preview — 390 × 844 (iPhone size)</div>
  <div class="phone">
    <div class="notch"></div>
    <iframe src="/" title="VertexLED mobile preview"></iframe>
  </div>
</body>
</html>
